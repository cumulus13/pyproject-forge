[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyproject-forge"
version = "1.0.2"
description = "Scan a directory tree and auto-generate pyproject.toml console_scripts entries, ensuring every script folder has a __main__.py."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
dependencies = [
    "tomlkit>=0.12",
]

[project.license]
text = "MIT"

[project.scripts]
pyproject-forge = "pyproject_forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = [
    "pyproject_forge",
]
